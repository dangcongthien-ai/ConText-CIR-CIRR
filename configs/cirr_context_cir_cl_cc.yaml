project:
  name: "CIR_Pipeline"
  seed: 42
  output_dir: "outputs"

data:
  dataset: "cirr"
  root: "CIRR"
  image_root_train: "CIRR/train"
  image_root_val: "CIRR/dev"
  image_root_test1: "CIRR/test1"
  metadata_root: "CIRR/cirr"
  use_extended_captions: false
  skip_empty_captions: true
  noun_phrase_backend: "stanza"
  noun_phrase_cache_dir: "noun_phrases"
  use_exported_noun_phrases: true
  noun_phrase_extractor: "constituency_minimal_np"
  stanza_resources_dir: ".stanza_resources"
  stanza_download_method: "none"
  num_workers: 8
  image_transform: "targetpad"
  target_pad_ratio: 1.25

model:
  backbone: "openai/clip-vit-large-patch14"
  backbone_size: "L"
  num_cross_attention_layers: 4
  num_heads: 8
  dropout: 0.1
  projection_dim: null
  normalize_embeddings: true
  freeze_vision_encoder: true
  freeze_text_encoder: true
  trainable_vision_layers: 2
  trainable_text_layers: 2
  use_gradient_checkpointing: true

loss:
  temperature: 0.07
  lambda_cont: 1.0
  lambda_cc: 0.08
  epsilon_cc: 0.0
  max_noun_phrases: 5
  use_query_image_negative: true
  query_negative_weight: 0.1
  text_cc_clean_only: true
  text_cc_clean_min_confidence: 0.7
  text_cc_attention_direction: "text_to_image"

train:
  batch_size: 16
  val_batch_size: 32
  max_epochs: 20
  learning_rate: 1.5e-5
  encoder_learning_rate: 1.0e-6
  weight_decay: 1.0e-2
  encoder_weight_decay: 5.0e-3
  warmup_ratio: 0.05
  precision: "16-mixed"
  accelerator: "gpu"
  devices: 1
  gradient_clip_val: 1.0
  val_check_interval: 1.0
  accumulate_grad_batches: 2
  early_stopping_patience: 3
  early_stopping_min_delta: 0.005
  save_top_k: 1
  monitor: "val/recall@10"
  monitor_mode: "max"
  log_cc_grad_norm: false
  cc_grad_norm_interval: 0

logger:
  name: "comet"
  offline: false
  project_name: "ConText-CIR-CIRR"
  workspace: null
  experiment_name: "cirr_clip_l14_targetpad_cl_cc_t2i"
  log_artifacts: true

faiss:
  index_type: "flat_ip"
  top_k: 50
  output_dir: "outputs/faiss/cirr_clip_l14_targetpad_cl_cc_t2i"
  hnsw_m: 32
  hnsw_ef_search: 64
