project:
  name: "CIR_Pipeline"
  seed: 42
  output_dir: "outputs"

data:
  dataset: "cirr"
  root: "CIRR"
  image_root_train: "CIRR/train"
  image_root_val: "CIRR/dev"
  image_root_test1: "CIRR/test1"
  metadata_root: "CIRR/cirr"
  use_extended_captions: false
  skip_empty_captions: true
  noun_phrase_backend: "none"
  stanza_resources_dir: ".stanza_resources"
  stanza_download_method: "none"
  num_workers: 8

model:
  backbone: "openai/clip-vit-base-patch32"
  backbone_size: "B"
  num_cross_attention_layers: 4
  num_heads: 8
  dropout: 0.1
  projection_dim: null
  normalize_embeddings: true
  freeze_vision_encoder: true
  freeze_text_encoder: true
  trainable_vision_layers: 2
  trainable_text_layers: 2
  use_gradient_checkpointing: true

loss:
  temperature: 0.07
  lambda_cc: 0.0
  epsilon_cc: 0.0
  max_noun_phrases: 0
  use_query_image_negative: true
  query_negative_weight: 0.1

train:
  batch_size: 64
  val_batch_size: 128
  max_epochs: 20
  learning_rate: 2.0e-5
  encoder_learning_rate: 2.0e-6
  weight_decay: 1.0e-2
  encoder_weight_decay: 5.0e-3
  warmup_ratio: 0.05
  precision: "16-mixed"
  accelerator: "gpu"
  devices: 1
  gradient_clip_val: 1.0
  val_check_interval: 1.0
  accumulate_grad_batches: 1
  early_stopping_patience: 3
  early_stopping_min_delta: 0.005
  save_top_k: 3
  monitor: "val/recall@10"
  monitor_mode: "max"

logger:
  name: "comet"
  offline: false
  project_name: "ConText-CIR-CIRR"
  workspace: null
  experiment_name: "context_cir_cirr_no_cc"
  log_artifacts: true

faiss:
  index_type: "flat_ip"
  top_k: 50
  output_dir: "outputs/faiss"
  hnsw_m: 32
  hnsw_ef_search: 64
